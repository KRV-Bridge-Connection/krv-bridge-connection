- question: I'm looking for assistance but don't know where to start?
  answer: <span>There are many ways to connect you with resources.</span><ul><li><a href="/resources/" class="btn btn-link">View our partners and their services.</a></li><li><a href="/211/" class="btn btn-link">Search 211</a></li><li><a href="/docs/krv-bridge-assistance-form.pdf" download="krv-bridge-assistance-form.pdf" class="btn btn-link">Fill out and submit our assistance form.</a></li></ul>
- question: What are your pantry hours?
  answer: <p>The food pantry located inside our building is operated independently by <strong><a href="/partners/salvation-army">The Salvation Army</a></strong>.</p><p>For the most accurate and up-to-date hours, please check their <a href="https://www.facebook.com/profile.php?id=61574323912303" target="_blank" rel="noopener noreferrer external">Salvation Army Facebook page</a> or call them at <a href="tel:+1-760-417-3056">(760) 417-3056</a> before visiting.</p>
- question: What services do you provide to the community?
  answer: KRV Bridge Connection connects community members with nonprofit organizations and essential services by providing a local space for these organizations to serve residents of the Kern River Valley. Through our partnerships, we help bring resources closer to home, reducing the need for residents to travel long distances to access services and support.
- question: Is this a nonprofit?
  answer: Yes, we are a <a href="https://www.guidestar.org/profile/99-4281880" rel="noopener noreferrer external" target="_blank">501 (c) (3) nonprofit</a>
- question: Where are you located?
  answer: We are located in Lake Isabella on the boulevard, just across from Lake Isabella True Value. <a href="/about/#location">Here is a map.</a>
- question: How can my nonprofit join?
  answer: We welcome inquiries from nonprofit organizations interested in serving the Kern River Valley through KRV Bridge Connection. To explore partnership opportunities and learn how your organization can become involved, please reach out through our <a href="/contact/">Contact Page</a> or call us directly. We look forward to connecting with organizations that share our commitment to bringing essential services and resources closer to home for our community.
